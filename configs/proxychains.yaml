# proxychains.yaml  VER 4.x
#
#   HTTP, SOCKS4a, SOCKS5 tunneling proxifier with DNS.

# Chain type: dynamic, strict, random, round_robin
chain_type: strict

# Make sense only if random or round_robin
# chain_len: 2

# Quiet mode (no output from library)
quiet_mode: false

# DNS settings
dns:
  # method: thread, daemon, or off
  method: thread
  # daemon_addr: "127.0.0.1:1053"
  # Set the class A subnet number for internal remote DNS mapping
  remote_subnet: 224

# Timeouts in milliseconds
timeouts:
  tcp_read_ms: 15000
  tcp_connect_ms: 8000

# Localnet exclusions - connections to these ranges will NOT use a proxy
# localnet:
#   - "192.168.1.0/24"
#   - "[::1]/128"

# DNAT rules
# dnat:
#   - orig: "1.1.1.1:1234"
#     new: "1.1.1.2:443"

# UID/GID spoofing (proxypermission)
# fake_uid: 0
# fake_gid: 0

# Proxy list
proxies:
  - type: socks4
    host: "127.0.0.1"
    port: 9050
